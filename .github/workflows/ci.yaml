name: ci

on:
  push:
    branches:
      - main
  workflow_dispatch:
  pull_request_target:
    types: [opened, reopened, synchronize]

# Permissions for default token
permissions:
  contents: read
  artifact-metadata: write

jobs:
  build:
    if: ${{ github.actor != vars.RELEASE_BOT_COMMITTER_NAME }}
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      matrix:
        python-version: [3.14]

    steps:
      - name: Create releaser-bot token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set PY env
        run: echo "PY=$(python -VV | sha256sum | cut -d' ' -f1)" >> $GITHUB_ENV

      - name: Install uv and dependencies
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7

      - name: Install the project
        run: uv sync --locked --all-extras --dev

      - name: Run check gate
        run: uv run python -m scripts.check

      - name: Upload coverage reports
        uses: actions/upload-artifact@v7
        with:
          name: coverage-reports
          path: |
            ${{ github.workspace }}/junit-coverage.xml
            ${{ github.workspace }}/pytest-coverage.txt
